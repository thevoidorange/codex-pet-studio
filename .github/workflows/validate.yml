name: validate

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  stdlib-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run CLI tests
        run: python -m unittest discover -s tests -v
      - name: Install production test dependency
        run: python -m pip install "Pillow>=10,<13" "numpy>=1.26,<3"
      - name: Run shared transparency tests
        run: python -m unittest discover -s .agents/skills/prepare-transparent-assets/tests -v
      - name: Run bundled Hatch Pet tests
        run: python -m unittest discover -s .agents/skills/hatch-pet/tests -v
      - name: Verify Delivery Target adapter
        run: python .agents/skills/pet-studio/scripts/studio.py target check --root .
      - name: Run repository privacy gate
        run: python .agents/skills/pet-studio/scripts/studio.py privacy-check --root .
