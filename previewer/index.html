<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Pet Previewer</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section
        id="configError"
        class="config-error"
        role="alert"
        tabindex="-1"
        hidden
      >
        <p id="configErrorScope" class="eyebrow"></p>
        <h1 id="configErrorTitle"></h1>
        <p id="configErrorSummary"></p>
        <dl class="diagnostic-facts">
          <div>
            <dt data-i18n="ui.diagnosticConfig"></dt>
            <dd id="configErrorConfig"></dd>
          </div>
          <div id="configErrorCandidateRow">
            <dt data-i18n="ui.diagnosticCandidate"></dt>
            <dd id="configErrorCandidate"></dd>
          </div>
          <div id="configErrorFieldRow">
            <dt data-i18n="ui.diagnosticField"></dt>
            <dd id="configErrorField"></dd>
          </div>
          <div>
            <dt data-i18n="ui.diagnosticCode"></dt>
            <dd id="configErrorCode"></dd>
          </div>
          <div id="configErrorExpectedRow">
            <dt data-i18n="ui.diagnosticExpected"></dt>
            <dd id="configErrorExpected"></dd>
          </div>
          <div id="configErrorActualRow">
            <dt data-i18n="ui.diagnosticActual"></dt>
            <dd id="configErrorActual"></dd>
          </div>
          <div>
            <dt data-i18n="ui.diagnosticNextStep"></dt>
            <dd id="configErrorNextStep"></dd>
          </div>
        </dl>
      </section>

      <header id="topbar" class="topbar">
        <div class="top-actions">
          <button
            id="autoPlayStatesToggle"
            class="button tour-toggle"
            type="button"
            aria-pressed="false"
            data-i18n="ui.autoPlayAllStates"
          ></button>
        </div>

        <div class="top-selectors">
          <label class="compact-select">
            <span data-i18n="ui.version"></span>
            <select id="versionSelect"></select>
          </label>
          <label class="compact-select">
            <span data-i18n="ui.language"></span>
            <select id="languageSelect"></select>
          </label>
        </div>
      </header>

      <section
        id="workspace"
        class="workspace"
        data-i18n-aria-label="ui.workspaceAria"
      >
        <aside class="state-panel">
          <div id="staticSection" class="state-section" hidden>
            <div class="panel-heading">
              <span data-i18n="ui.static"></span>
            </div>
            <nav
              id="staticList"
              class="state-list static-list"
              data-i18n-aria-label="ui.staticListAria"
            ></nav>
          </div>

          <div id="runtimeStateHeading" class="panel-heading">
            <span data-i18n="ui.states"></span>
            <span id="stateCount" class="muted"></span>
          </div>
          <nav
            id="stateList"
            class="state-list"
            data-i18n-aria-label="ui.stateListAria"
          ></nav>

          <div
            id="tourProgress"
            class="tour-progress"
            aria-live="polite"
            hidden
          >
            <div class="tour-progress-row">
              <span id="tourLabel"></span>
              <span id="tourProgressText"></span>
            </div>
            <div class="progress-track">
              <div id="tourProgressBar" class="progress-bar"></div>
            </div>
          </div>
        </aside>

        <section class="viewer-panel">
          <div
            class="mode-tabs"
            role="tablist"
            data-i18n-aria-label="ui.previewModeAria"
          >
            <button
              id="animationTab"
              class="mode-tab is-active"
              role="tab"
              aria-selected="true"
              type="button"
              data-i18n="ui.animationStates"
            ></button>
            <button
              id="lookTab"
              class="mode-tab"
              role="tab"
              aria-selected="false"
              type="button"
              data-i18n="ui.lookDirections"
            ></button>
          </div>

          <div id="stage" class="stage stage-paper">
            <div class="stage-grid" aria-hidden="true"></div>
            <label
              class="preview-size-control"
              data-i18n-title="ui.previewSizeTitle"
            >
              <span data-i18n="ui.previewSize"></span>
              <input
                id="previewSizeInput"
                type="range"
                step="1"
                value="160"
                data-i18n-aria-label="ui.previewSizeAria"
              />
              <output id="previewSizeValue" for="previewSizeInput">160 px</output>
            </label>
            <div
              id="spritePlayer"
              class="sprite-player"
              role="img"
              aria-label=""
            ></div>
            <div id="directionTarget" class="direction-target" aria-hidden="true">
              <span></span>
            </div>
            <div class="stage-status" aria-live="polite">
              <span class="stage-mode-status">
                <span id="stageModeLabel"></span>
                <span id="atlasPhaseBadge" class="atlas-phase-badge" hidden></span>
              </span>
              <span id="frameReadout"></span>
            </div>
          </div>

          <div id="animationControls" class="controls">
            <div
              class="segmented"
              data-i18n-aria-label="ui.playbackAria"
            >
              <button
                id="runtimeModeButton"
                class="segment is-active"
                type="button"
                data-i18n="ui.runtimeTiming"
                data-i18n-title="ui.runtimeTimingTitle"
              ></button>
              <button
                id="endlessModeButton"
                class="segment"
                type="button"
                data-i18n="ui.endlessLoop"
                data-i18n-title="ui.endlessLoopTitle"
              ></button>
            </div>
            <div
              id="transportControls"
              class="transport"
              data-i18n-aria-label="ui.transportAria"
            >
              <button
                id="previousFrameButton"
                class="icon-button"
                type="button"
                data-i18n-title="ui.previousFrame"
              >
                ←
              </button>
              <button id="playPauseButton" class="button" type="button"></button>
              <button
                id="nextFrameButton"
                class="icon-button"
                type="button"
                data-i18n-title="ui.nextFrame"
              >
                →
              </button>
              <button
                id="restartButton"
                class="button"
                type="button"
                data-i18n="ui.restart"
              ></button>
            </div>
            <p id="previewModeHelp" class="mode-help" aria-live="polite"></p>
            <p
              id="takeStatus"
              class="sr-only"
              role="status"
              aria-live="polite"
            ></p>
          </div>

          <div id="lookControls" class="look-controls" hidden>
            <div
              class="look-actions"
              role="group"
              data-i18n-aria-label="ui.lookModeAria"
            >
              <button
                id="orbitButton"
                class="button look-toggle"
                type="button"
                aria-pressed="false"
              ></button>
              <button
                id="followPointerButton"
                class="button look-toggle"
                type="button"
                aria-pressed="false"
              ></button>
            </div>
            <div
              id="directionList"
              class="direction-list"
              data-i18n-aria-label="ui.directionListAria"
            ></div>
            <p class="hint" data-i18n="ui.pointerHint"></p>
          </div>

          <div
            class="background-control"
            data-i18n-aria-label="ui.backgroundAria"
          >
            <span data-i18n="ui.background"></span>
            <button
              class="swatch is-active"
              data-background="paper"
              type="button"
              data-i18n-aria-label="ui.backgroundPaper"
            ></button>
            <button
              class="swatch swatch-gray"
              data-background="gray"
              type="button"
              data-i18n-aria-label="ui.backgroundGray"
            ></button>
            <button
              class="swatch swatch-dark"
              data-background="dark"
              type="button"
              data-i18n-aria-label="ui.backgroundDark"
            ></button>
          </div>
        </section>

        <aside class="detail-panel">
          <p id="stateTag" class="state-tag"></p>
          <h2 id="stateTitle"></h2>
          <p id="stateDescription" class="state-description"></p>

          <dl class="state-meta">
            <div>
              <dt data-i18n="ui.expression"></dt>
              <dd id="stateIntent"></dd>
            </div>
            <div>
              <dt data-i18n="ui.desktopTrigger"></dt>
              <dd id="stateTrigger"></dd>
            </div>
            <div>
              <dt data-i18n="ui.actionLength"></dt>
              <dd id="stateDuration"></dd>
            </div>
          </dl>

          <div class="frame-section">
            <div class="panel-heading">
              <span id="frameSectionTitle" data-i18n="ui.keyframes"></span>
            </div>
            <div id="frameStrip" class="frame-strip"></div>
          </div>
        </aside>
      </section>

      <section
        id="mechanicsBoard"
        class="mechanics-board"
        data-i18n-aria-label="ui.mechanicsTitle"
      >
        <div class="mechanics-heading">
          <div>
            <p class="eyebrow" data-i18n="ui.mechanicsEyebrow"></p>
            <h2 data-i18n="ui.mechanicsTitle"></h2>
          </div>
          <p>
            <span id="versionStatus"></span>
            <span aria-hidden="true"> · </span>
            <span id="mechanicsSummary"></span>
          </p>
        </div>
        <div id="mechanicsRows" class="mechanics-rows"></div>
      </section>

      <footer id="previewFooter">
        <span data-i18n="ui.sourceFooter"></span>
        <span data-i18n="ui.shortcutFooter"></span>
      </footer>
    </main>

    <script src="./i18n.js"></script>
    <script src="./target-data.js"></script>
    <script src="./preview-data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
